---
# PgBouncer — transaction-pooling mode
# Sits between application pods and the CloudNativePG cluster.
# Reads the r/w service for primary and the r-only service for replicas.
#
# Credentials are injected from the same secret CloudNativePG created for
# the application user (lumora-pg-app-secret).

apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: lumora-db
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pool
data:
  pgbouncer.ini: |
    [databases]
    ; Primary (read-write)
    lumora = host=lumora-pg-rw.lumora-db.svc.cluster.local port=5432 dbname=lumora
    ; Replicas (read-only)
    lumora_ro = host=lumora-pg-ro.lumora-db.svc.cluster.local port=5432 dbname=lumora

    [pgbouncer]
    listen_addr        = 0.0.0.0
    listen_port        = 5432
    auth_type          = scram-sha-256
    auth_file          = /etc/pgbouncer/userlist.txt

    ; Transaction pooling — allows thousands of clients with far fewer
    ; server connections. Incompatible with SET/advisory locks/LISTEN.
    pool_mode          = transaction

    ; Connection limits
    max_client_conn    = 2000
    default_pool_size  = 25
    min_pool_size      = 5
    reserve_pool_size  = 5
    reserve_pool_timeout = 3

    ; Timeouts (seconds)
    server_connect_timeout = 10
    server_idle_timeout    = 600
    client_idle_timeout    = 0
    query_timeout          = 0
    query_wait_timeout     = 120
    idle_transaction_timeout = 0

    ; Logging
    log_connections    = 0
    log_disconnections = 0
    log_pooler_errors  = 1
    stats_period       = 60

    ; Admin
    admin_users        = pgbouncer_admin
    stats_users        = pgbouncer_stats

    ; TLS — enable in production with real certs
    ; server_tls_sslmode = require
    ; server_tls_ca_file = /etc/pgbouncer/ca.crt

    ; Health check — pgbouncer responds to a simple SELECT 1 on this database
    [databases]
    pgbouncer = host=127.0.0.1 dbname=pgbouncer

---
# userlist.txt is generated by the init container from the k8s secret.
# The ConfigMap below carries the template; the actual file with hashed
# password is written to an emptyDir volume at pod startup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-init-script
  namespace: lumora-db
data:
  generate-userlist.sh: |
    #!/bin/sh
    set -eu
    # Write userlist.txt expected by pgbouncer auth_file
    # Format: "username" "password"
    # Password must be md5 or scram-sha-256 hash, or plaintext prefixed with p:
    cat > /etc/pgbouncer/userlist.txt <<EOF
    "lumora_app" "p:${APP_PASSWORD}"
    "pgbouncer_admin" "p:${ADMIN_PASSWORD}"
    "pgbouncer_stats" "p:${STATS_PASSWORD}"
    EOF
    echo "userlist.txt written."

---
# Secret for PgBouncer admin/stats users (separate from app user)
apiVersion: v1
kind: Secret
metadata:
  name: pgbouncer-admin-secret
  namespace: lumora-db
type: Opaque
stringData:
  ADMIN_PASSWORD: CHANGE_ME_PGBOUNCER_ADMIN    # use a secrets manager in production
  STATS_PASSWORD: CHANGE_ME_PGBOUNCER_STATS

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: lumora-db
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pool
    app.kubernetes.io/part-of: lumora
spec:
  replicas: 2   # two PgBouncer pods for HA; both are stateless
  selector:
    matchLabels:
      app.kubernetes.io/name: pgbouncer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer
        app.kubernetes.io/component: connection-pool
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70       # uid used by the official pgbouncer image
        fsGroup: 70
      # Spread the two replicas across different nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pgbouncer
                topologyKey: kubernetes.io/hostname

      initContainers:
        - name: generate-userlist
          image: busybox:1.36
          command: ["/bin/sh", "/scripts/generate-userlist.sh"]
          env:
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumora-pg-app-secret
                  key: password
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-admin-secret
                  key: ADMIN_PASSWORD
            - name: STATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-admin-secret
                  key: STATS_PASSWORD
          volumeMounts:
            - name: pgbouncer-config-dir
              mountPath: /etc/pgbouncer
            - name: init-scripts
              mountPath: /scripts

      containers:
        - name: pgbouncer
          image: pgbouncer/pgbouncer:1.22.1
          ports:
            - name: pgbouncer
              containerPort: 5432
              protocol: TCP
          env:
            - name: PGBOUNCER_CONFIG
              value: /etc/pgbouncer/pgbouncer.ini
          livenessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: pgbouncer-ini
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
            - name: pgbouncer-config-dir
              mountPath: /etc/pgbouncer
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

        # pgbouncer_exporter sidecar — exposes Prometheus metrics on :9127
        - name: pgbouncer-exporter
          image: prometheuscommunity/pgbouncer-exporter:v0.7.0
          args:
            - --web.listen-address=:9127
            - --pgBouncer.connectionString=postgres://pgbouncer_stats:$(STATS_PASSWORD)@127.0.0.1:5432/pgbouncer?sslmode=disable
          env:
            - name: STATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-admin-secret
                  key: STATS_PASSWORD
          ports:
            - name: metrics
              containerPort: 9127
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: pgbouncer-ini
          configMap:
            name: pgbouncer-config
        - name: init-scripts
          configMap:
            name: pgbouncer-init-script
            defaultMode: 0755
        - name: pgbouncer-config-dir
          emptyDir: {}

---
# Service — app pods connect to pgbouncer:5432
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: lumora-db
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pool
spec:
  selector:
    app.kubernetes.io/name: pgbouncer
  ports:
    - name: pgbouncer
      port: 5432
      targetPort: pgbouncer
      protocol: TCP
    - name: metrics
      port: 9127
      targetPort: metrics
      protocol: TCP
  type: ClusterIP

---
# PodDisruptionBudget — keep at least 1 PgBouncer pod running during node drain
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer-pdb
  namespace: lumora-db
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pgbouncer
