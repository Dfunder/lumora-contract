---
# Namespace (shared with the PostgreSQL cluster)
apiVersion: v1
kind: Namespace
metadata:
  name: lumora-db
  labels:
    app.kubernetes.io/part-of: lumora

---
# MinIO credentials secret (replace values before applying)
apiVersion: v1
kind: Secret
metadata:
  name: minio-s3-secret
  namespace: lumora-db
type: Opaque
stringData:
  ACCESS_KEY_ID: CHANGE_ME_MINIO_ACCESS_KEY       # ≥ 3 characters
  SECRET_ACCESS_KEY: CHANGE_ME_MINIO_SECRET_KEY   # ≥ 8 characters

---
# Persistent volume for MinIO data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: lumora-db
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-store
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard   # override with a fast storage class in production

---
# MinIO Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: lumora-db
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-store
    app.kubernetes.io/part-of: lumora
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  strategy:
    type: Recreate   # single-node MinIO; upgrade in-place to avoid dual-writer split
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: object-store
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-06-04T19-20-08Z
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-s3-secret
                  key: ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-s3-secret
                  key: SECRET_ACCESS_KEY
            - name: MINIO_VOLUMES
              value: "/data"
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data

---
# Service — internal cluster access for barman WAL archiving
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: lumora-db
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-store
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
      protocol: TCP
    - name: console
      port: 9001
      targetPort: console
      protocol: TCP
  type: ClusterIP

---
# Job: create the WAL bucket on first boot
# Runs once after MinIO is up; harmless to re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: lumora-db
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: init
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://minio:9000/minio/health/ready; do
                echo "waiting for minio…"; sleep 3
              done
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2024-06-03T20-14-17Z
          env:
            - name: MC_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-s3-secret
                  key: ACCESS_KEY_ID
            - name: MC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-s3-secret
                  key: SECRET_ACCESS_KEY
          command:
            - sh
            - -c
            - |
              mc alias set local http://minio:9000 "$MC_ACCESS_KEY" "$MC_SECRET_KEY"
              mc mb --ignore-existing local/lumora-wal
              mc anonymous set none local/lumora-wal
              echo "Bucket lumora-wal ready."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
